# /etc/tlp.d/10-battery.conf
# Override per la modalità BATTERIA - Prestazioni bilanciate e minore calore

# ---- CPU (Riduci calore e consumi) ----
# Mantieni il governor powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
# Limita la frequenza massima per evitare surriscaldamento in batteria
CPU_SCALING_MAX_FREQ_ON_BAT=2500000
# Frequenza minima (lasciamo invariata)
CPU_SCALING_MIN_FREQ_ON_BAT=400000

# Disabilita il turbo boost in batteria (riduce drasticamente calore e consumi)
CPU_BOOST_ON_BAT=0

# EPP: orientato al risparmio energetico
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power

# Limita la percentuale di performance (opzionale, lascia a 0-100 per ora)
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=100

# ---- PCIe ASPM (evita modalità estrema che può causare lag) ----
PCIE_ASPM_ON_BAT=powersave

# ---- Profilo termico della piattaforma ----
# Usa 'balanced' in batteria per una curva di ventola più conservativa
PLATFORM_PROFILE_ON_BAT=balanced

# ---- Audio: risparmio energetico in batteria ----
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_ON_AC=0

# ---- Runtime PM (lascia gestire a TLP) ----
RUNTIME_PM_ON_BAT=auto
