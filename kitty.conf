# ============================================
# Kitty configuration - Nord-Arch Modern
# Coerente con GTK4/Waybar/Wofi
# ============================================

# --- Aspetto finestra ---
background_opacity 0.90
dynamic_background_opacity yes
background_tint 0.90
window_padding_width 8
hide_window_decorations yes
startup_mode maximized
confirm_os_window_close 0
popup_opacity 1.0

# --- Font ---
font_family Iosevka Term SemiBold
bold_font        Iosevka Term Bold
italic_font      Iosevka Term Italic
bold_italic_font Iosevka Term Bold Italic
font_size 13.0

# --- Colori Nord (coerenti con #3281EA) ---
foreground             #D8DEE9
background             #2C2C2C
selection_foreground   #2C2C2C
selection_background   #3281EA

# Colori normali (Nord palette)
color0  #3B4252
color1  #BF616A
color2  #A3BE8C
color3  #EBCB8B
color4  #81A1C1
color5  #B48EAD
color6  #88C0D0
color7  #E5E9F0

# Colori brillanti
color8  #4C566A
color9  #BF616A
color10 #A3BE8C
color11 #EBCB8B
color12 #3281EA
color13 #B48EAD
color14 #8FBCBB
color15 #ECEFF4

# --- Cursore ---
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0
cursor_trail 0
cursor #3281EA

# --- Selezione ---
copy_on_select no
clipboard_control write-clipboard write-primary
select_by_word_characters :@-./_~?&=%+#

# --- Scorciatoie tastiera ---
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+n new_window
map ctrl+shift+f show_scrollback
map ctrl+shift+o kitten hints --type path --program @
map ctrl+shift+a set_background_opacity +0.05
map ctrl+shift+m set_background_opacity -0.05

# --- Performance ---
scrollback_lines 10000
repaint_delay 10
input_delay 3
sync_to_monitor yes

# --- Audio ---
enable_audio_bell no

# --- Tab bar (stile coerente) ---
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_background #212121
active_tab_background #3281EA
active_tab_foreground #ffffff
inactive_tab_background #3B4252
inactive_tab_foreground #D8DEE9
tab_bar_margin_width 0
tab_bar_margin_height 0 4

# Fallback Nerd Font per le icone
symbol_map U+E000-U+E00A,U+EA60-U+EBEB,U+E0A0-U+E0C8,U+E0CA,U+E0CC-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B1,U+E700-U+E7C5,U+F000-U+F2E0,U+F300-U+F372,U+F400-U+F532,U+F0001-U+F1AF0 JetBrainsMono Nerd Font
