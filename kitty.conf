# ================================
# Kitty configuration - Tema Nord Ottimizzato (Arch/Minimalista)
# ================================

# --- Aspetto finestra ---
background_opacity 0.80
dynamic_background_opacity yes
background_tint 0.85
window_padding_width 6
hide_window_decorations yes
startup_mode maximized
confirm_os_window_close 0

# Fix per rendere i pop-up/suggerimenti opachi e leggibili
popup_opacity 1.0 

# --- Font ---
font_family Iosevka Term SemiBold
bold_font        Iosevka Term Bold
italic_font      Iosevka Term Italic
bold_italic_font Iosevka Term Bold Italic
font_size 13.0

# --- Colori (Tema Nord, Ottimizzato Arch) ---
foreground             #D8DEE9
background             #2E3440
selection_foreground   #2E3440
selection_background   #8FBCBB 

# Colori normali
color0  #3B4252
color1  #BF616A
color2  #A3BE8C
color3  #EBCB8B
color4  #81A1C1
color5  #B48EAD
color6  #88C0D0
color7  #E5E9F0

# Colori brillanti (Tweak per maggior contrasto)
color8  #4C566A
color9  #BF616A
color10 #A3BE8C
color11 #EBCB8B
color12 #81A1C1
color13 #B48EAD
color14 #8FBCBB
color15 #ECEFF4

# --- Cursore ---
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0
cursor_trail 0

# --- Selezione ---
copy_on_select no
clipboard_control write-clipboard write-primary
select_by_word_characters :@-./_~?&=%+#

# --- Scorciatoie tastiera ---
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+n new_window
map ctrl+shift+f show_scrollback
map ctrl+shift+o kitten hints --type path --program @
map ctrl+shift+a set_background_opacity +0.05
map ctrl+shift+m set_background_opacity -0.05

# --- Performance ---
scrollback_lines 10000
repaint_delay 10
input_delay 3
sync_to_monitor yes

# --- Audio ---
enable_audio_bell no
